services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "127.0.0.1:58080:8080"
    volumes:
      - ./settings.yml:/etc/searxng/settings.yml:z
    environment:
      - SEARXNG_SECRET_KEY=edd0419ee697e2c91cc0886fcb92fb21d098cd9ae8361c3a180737ef960c83ba
    networks:
      - searxng-net
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

networks:
  searxng-net:
    driver: bridge
