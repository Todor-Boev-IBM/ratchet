use_default_settings:
  engines:
    keep_only:
      # NOTE: duckduckgo & brave removed — they are persistently blocked
      # (CAPTCHA / "too many requests") from this residential IP and only
      # added latency + poisoned the ban loop. Re-add if you route via Tor.
      - google
      # - braveapi
      - wikipedia
      - stackoverflow
      - superuser
      - github
      - npm
      - docker hub
      - arch linux wiki
      - mdn

general:
  debug: false
  instance_name: "SearXNG"

server:
  limiter: false
  image_proxy: false
  bind_address: "0.0.0.0:8080"
  worker_count: 8
  secret_key: "edd0419ee697e2c91cc0886fcb92fb21d098cd9ae8361c3a180737ef960c83ba"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  # Google is now the only general-web scraper and is intermittently
  # CAPTCHA'd. Keep the bench time short so one failure doesn't blank out
  # general-web results across the agent's next several queries.
  max_ban_time_on_fail: 30
  ban_time_on_fail: 5
  formats:
    - html
    - json

# Global HTTP behaviour for outbound engine requests.
outgoing:
  request_timeout: 5.0
  max_request_timeout: 12.0
  pool_connections: 100
  pool_maxsize: 20
  enable_http2: true
  retries: 1

ui:
  static_use_hash: true
  infinite_scroll: false
  default_theme: simple

enabled_plugins:
  - "Hash plugin"
  - "Self Information"
  - "Tracker URL remover"
  - "Ahmia blacklist"

engines:
  # --- GENERAL WEB ---
  # Google is the only general-web scraper that still returns results from
  # this IP (DDG/Brave are blocked). It's the primary breadth source now, so
  # it gets the highest general-web weight. Still fails intermittently.
  - name: google
    disabled: false
    weight: 3
    timeout: 5.0

  # - name: braveapi
  #   engine: braveapi
  #   api_key: "YOUR-API-KEY"
  #   results_per_page: 20

  # --- HIGH-SIGNAL REFERENCE ---
  - name: wikipedia
    disabled: false
    weight: 2
    timeout: 3.0

  # MDN: authoritative JS/TS/Web-platform docs (API-backed, no CAPTCHA)
  - name: mdn
    disabled: false
    categories: [it]
    weight: 2
    timeout: 3.0

  # --- Q&A: only fires on q&a category, not general web ---
  - name: stackoverflow
    categories: [q&a]
    weight: 2
    timeout: 3.0

  - name: superuser
    categories: [q&a]
    weight: 1
    timeout: 3.0

  # --- CODE-SPECIFIC: API-backed, structured results, zero scrape noise ---

  # GitHub: repos, code, issues
  - name: github
    disabled: false
    categories: [it, repos]
    weight: 3
    timeout: 3.0

  # npm: essential for JS/Node/tooling queries
  - name: npm
    disabled: false
    categories: [it, packages]
    weight: 2
    timeout: 3.0

  # Docker Hub: container and infra queries
  - name: docker hub
    disabled: false
    categories: [it, packages]
    weight: 1
    timeout: 3.0

  # Arch Wiki: best-in-class for system, tooling, and config documentation
  - name: arch linux wiki
    disabled: false
    categories: [it, software wikis]
    weight: 2
    timeout: 3.0
